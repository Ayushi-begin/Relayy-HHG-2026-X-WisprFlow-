# Local development stack: Postgres (matches production Neon), the API, and the Vite dev server.
#   docker compose up --build
# API http://localhost:8000 · UI http://localhost:5173 · Postgres localhost:5432 (relayy/relayy)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relayy
      POSTGRES_PASSWORD: relayy  # local-only credentials; never reuse them anywhere else
      POSTGRES_DB: relayy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayy -d relayy"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://relayy:relayy@db:5432/relayy
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
